name: RAG Index Refresh

on:
  workflow_dispatch:
  schedule:
    - cron: "0 23 * * *" # 02:00 Turkiye (UTC+3)
  push:
    branches: ["main"]
    paths:
      - "backend/data/rag/selcuk/**"
      - "backend/data/selcuk_knowledge_base.json"
      - "backend/data/selcuk_qa_dataset.jsonl"

jobs:
  refresh-rag:
    if: github.event_name != 'push' || !contains(github.event.head_commit.message, 'chore: refresh rag index')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Cache model downloads
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/huggingface
            ~/.cache/torch
          key: ${{ runner.os }}-rag-${{ hashFiles('backend/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-rag-

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Refresh RAG index
        run: |
          python backend/rag_ingest.py --input backend/data/rag/selcuk --output backend/data/rag --reset

      - name: Detect changes
        id: diff
        run: |
          if git status --porcelain | grep -q "backend/data/rag/"; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit and push to main
        if: steps.diff.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add backend/data/rag/index.faiss backend/data/rag/metadata.json backend/data/rag/index_meta.json
          git commit -m "chore: refresh rag index [skip ci]"
          git push
